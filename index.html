<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sentinel</title>
<meta name="description" content="Sentinel: an AI agent that notices when regular customers drift away and helps you win them back with the smallest nudge. Prototype on sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: full-width, picture-led feed. Sticky top bar, one hero card, then simple sections; floating pill nav at the bottom. */
:root{
  --bg:#FFFFFF; --surface:#F3F5F2; --card:#FFFFFF; --ink:#101512; --muted:#5E6A62; --line:#E4E8E3;
  --green:#0B6B47; --green-ink:#FFFFFF; --green-soft:#E2F3E9; --hero:#0E2B20; --hero-ink:#F2FBF5;
  --act:#B9430B; --act-soft:#FDE7D9; --held:#946000; --held-soft:#FFF0D2; --ok:#1C7448; --ok-soft:#E2F3E9;
  --shadow:0 8px 30px rgba(16,21,18,.10);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C110E; --surface:#151C18; --card:#18201B; --ink:#EEF4F0; --muted:#9DAAA2; --line:#26302A;
  --green:#3DBE86; --green-ink:#06160E; --green-soft:#16301F; --hero:#123A2A; --hero-ink:#F2FBF5;
  --act:#FF9A63; --act-soft:#3A1F12; --held:#F1BE52; --held-soft:#332810; --ok:#5ED39A; --ok-soft:#16301F;
  --shadow:0 8px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C110E; --surface:#151C18; --card:#18201B; --ink:#EEF4F0; --muted:#9DAAA2; --line:#26302A;
  --green:#3DBE86; --green-ink:#06160E; --green-soft:#16301F; --hero:#123A2A; --hero-ink:#F2FBF5;
  --act:#FF9A63; --act-soft:#3A1F12; --held:#F1BE52; --held-soft:#332810; --ok:#5ED39A; --ok-soft:#16301F;
  --shadow:0 8px 30px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px);font-weight:800}
h2{font-size:clamp(22px,3vw,30px);font-weight:800}
h3{font-size:19px;font-weight:700}
p{margin:0}
a{color:var(--green);font-weight:600}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:10px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.mark{width:34px;height:34px;border-radius:11px;background:var(--green);display:grid;place-items:center}
.store{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-size:14px;font-weight:600}
.store .logo{width:26px;height:26px;border-radius:50%;background:#F3D9C4;display:grid;place-items:center;font-weight:800;font-size:13px;color:#7A3E12}
.sample{font-size:12px;font-weight:700;color:var(--held);background:var(--held-soft);border-radius:999px;padding:4px 10px}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:var(--surface);border-radius:999px;padding:7px 14px}
.live{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.live.off{background:var(--muted);box-shadow:none}

main{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 130px;display:flex;flex-direction:column;gap:32px}
section{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:32px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;min-height:300px}
.hero.calm{grid-template-columns:1fr}
.hero-text{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero h2{font-size:clamp(26px,3.6vw,40px)}
.hero p{font-size:17px;opacity:.88;max-width:52ch}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.eyebrow.dark{color:var(--green);opacity:1}
.hero-art{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;justify-items:center}
.hero-art.one{grid-template-columns:1fr}

.ptile{background:var(--tint);border-radius:24px;display:grid;place-items:center;aspect-ratio:1/1;width:100%;max-width:100%}
.ptile.small{border-radius:20px;max-width:150px}
.ptile.big{max-width:300px;border-radius:32px}
.ptile.hero-tile{border-radius:32px;max-width:420px}
.ptile svg{width:72%;height:auto}

.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:16px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.light{background:#FFFFFF;color:#0E2B20;align-self:flex-start}
.btn.ghost-light{background:transparent;color:var(--hero-ink);border:1.5px solid rgba(255,255,255,.35);align-self:flex-start;min-height:40px;padding:8px 18px;font-size:14px}
.btn.primary{background:var(--green);color:var(--green-ink)}
.btn.soft{background:var(--surface);color:var(--ink)}
.btn.big{font-size:18px;min-height:58px;padding:16px 28px;width:100%}

.checks{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:12px;align-items:center;font-size:16px;font-weight:500}
.checks li.busy{opacity:.85}
.tick{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.person{flex:none;width:150px;background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:4px;scroll-snap-align:start;font-size:14px}
.person b{font-size:16px;margin-top:6px}
.person span{color:var(--muted)}
.person .late{color:var(--act);font-weight:600}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#3B2A1E;flex:none;border:3px solid var(--bg)}

.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pcard{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.pcard:disabled{cursor:default}
.pname{font-weight:700;font-size:16px}
.pill{align-self:flex-start;font-size:13px;font-weight:700;border-radius:999px;padding:4px 11px;background:var(--surface);color:var(--muted)}
.pill.act{background:var(--act-soft);color:var(--act)}
.pill.held{background:var(--held-soft);color:var(--held)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.foot{font-size:14px;color:var(--muted)}

.back{background:none;border:0;padding:0;font-weight:700;color:var(--muted);align-self:flex-start}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,4vw,56px);align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.lead{font-size:18px;color:var(--muted);max-width:56ch}
.phone-msg{background:var(--surface);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:8px;max-width:420px}
.from{font-size:13px;font-weight:700;color:var(--muted)}
.bubble{background:var(--card);border-radius:6px 20px 20px 20px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:10px;font-size:15px}
.bubble .cta{border-top:1px solid var(--line);padding-top:10px;text-align:center;font-weight:700;color:var(--green)}
.expect,.note{background:var(--green-soft);border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;font-size:16px}
.note.ok{background:var(--ok-soft)}
.big-emoji{font-size:26px;line-height:1}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.why li{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.ic.ok{background:var(--ok-soft);color:var(--ok)}
.ic.warn{background:var(--held-soft);color:var(--held)}
.ic.info{background:var(--surface);color:var(--muted)}
.unsure{background:var(--surface);border-radius:18px;padding:14px 16px}
.unsure summary{font-weight:700;cursor:pointer}
.unsure p{margin-top:8px;color:var(--muted)}
.fair{font-size:14px;color:var(--muted)}
.paused{font-weight:600;color:var(--held)}
.cta-row{display:flex;flex-direction:column;gap:10px;position:sticky;bottom:96px;background:var(--bg);padding-top:8px}
.cta-sub{display:flex;gap:10px;flex-wrap:wrap}
.cta-sub .btn{flex:1}

.center{max-width:620px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:20px}
.center.wide{max-width:700px}
.center .btn.big{max-width:420px}
.done-badge{width:84px;height:84px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-size:40px;font-weight:800}
.mini-list{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.mini-list div{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 16px}
.em{font-size:24px}
.stack{display:flex;align-items:center}
.stack .av{margin-left:-10px}
.stack .av:first-child{margin-left:0}
.plus{margin-left:8px;font-weight:800;color:var(--green)}
.compare{width:100%;display:flex;flex-direction:column;gap:14px;background:var(--surface);border-radius:24px;padding:20px;text-align:left}
.compare .row{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:15px}
.bar{height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px}
.bar.grey i{background:var(--muted)}
.ask{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px}

.activity{display:flex;flex-direction:column;background:var(--surface);border-radius:24px;padding:8px 18px}
.act-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.act-row:last-child{border-bottom:0}
.act-row div{display:flex;flex-direction:column}
.act-row div span{color:var(--muted);font-size:14px}
.act-row .t{color:var(--muted);font-size:13px}
.who{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:3px}
.who.ai{color:var(--green)} .who.guard{color:var(--held)} .who.you{color:var(--ink)}

.rules{display:flex;flex-direction:column;gap:12px}
.rule{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--surface);border-radius:22px;padding:18px 20px}
.rule div{display:flex;flex-direction:column}
.rule span{color:var(--muted);font-size:14px}
.stepper{display:flex !important;flex-direction:row !important;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);font-size:20px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepper b{min-width:44px;text-align:center}
.switch{width:56px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--green)}
.switch.on i{left:28px}

.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:40}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);max-height:86vh;overflow:auto;background:var(--card);border-radius:30px 30px 0 0;padding:14px 22px calc(22px + env(safe-area-inset-bottom,0px));z-index:41;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet .close{margin-top:4px}
.sheet-prod{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:20px;padding:16px}
.opt div{display:flex;flex-direction:column;gap:2px}
.opt span{color:var(--muted);font-size:14px}
.opt .val{font-weight:700;color:var(--ink);text-align:right;font-size:14px}
.opt.sel{border-color:var(--green);background:var(--green-soft)}
.opt:disabled{opacity:.7;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:11px 18px;font-weight:600}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:6px;background:var(--card);border-radius:999px;padding:8px;box-shadow:var(--shadow);border:1px solid var(--line)}
.navbtn{border:0;background:none;border-radius:999px;padding:10px 18px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--muted)}
.navbtn.on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
[hidden]{display:none!important}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;min-height:0}
  .hero-art{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero-art.one{grid-template-columns:1fr}
  .ptile.big{max-width:200px}
  .split{grid-template-columns:1fr}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .compare .row{grid-template-columns:1fr;gap:6px}
  .act-row{grid-template-columns:1fr}
  .navbtn span{display:none}
  .store .nm{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l5-5 4 3 8-8"/><path d="M15 5h5v5"/></svg></span>Sentinel</div>
  <span class="store"><span class="logo">D</span><span class="nm">Dewleaf Skincare</span></span>
  <span class="sample">Sample data</span>
  <span class="status" id="status"></span>
</div></header>
<main id="main"></main>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body></html>
